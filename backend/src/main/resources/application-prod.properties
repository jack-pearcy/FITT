# Production profile. Every value comes from the environment so the image
# stays the same across machines and no secret is ever baked into the build.
# The placeholders below are filled by Docker Compose from a gitignored .env file.

spring.datasource.url=${FITT_DB_URL}
spring.datasource.username=${FITT_DB_USERNAME}
spring.datasource.password=${FITT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validate the schema against the entities, do not let Hibernate change it.
# Schema ownership stays explicit, same stance as local.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT config, injected from the environment. The secret has no default on
# purpose so a missing value fails fast instead of running with a weak key.
fitt.jwt.secret-value=${FITT_JWT_SECRET_VALUE}
fitt.jwt.issuer=${FITT_JWT_ISSUER:fitt-api}
fitt.jwt.ttl-seconds=${FITT_JWT_TTL_SECONDS:3600}
spring.application.name=backend
spring.jpa.open-in-view=false
fitt.cors.allowed-origins=http://localhost:4200

# Fetch lazy collections in batches instead of one query per parent row. The plan
# and session graphs are nested lists, so this turns the N+1 reads on the list
# endpoints into a handful of IN queries without risking a multiple-bag fetch error.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# AI coach. The key comes from the environment only and is blank by default,
# which leaves the coach switched off (the endpoint answers 503). Never put a
# key in this file.
fitt.coach.api-key=${FITT_COACH_API_KEY:}
fitt.coach.model=${FITT_COACH_MODEL:claude-opus-5-5}

# Two-step sign-in. The key that encrypts authenticator secrets comes from the
# environment only and is blank by default, which leaves the feature switched
# off (setup answers 503 and no sign-in changes). 32 random bytes, Base64
# encoded. Never put a key in this file.
fitt.mfa.encryption-key=${FITT_MFA_ENCRYPTION_KEY:}

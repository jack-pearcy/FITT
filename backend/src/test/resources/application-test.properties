# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:fitt_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Deterministic signing key so tests can construct and verify tokens predictably
fitt.jwt.secret-value=fitt-test-secret-key-at-least-32-characters!!
fitt.jwt.issuer=fitt-api
fitt.jwt.ttl-seconds=3600
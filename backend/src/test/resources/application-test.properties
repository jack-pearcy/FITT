# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:fitt_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Deterministic signing key so tests can construct and verify tokens predictably
fitt.jwt.secret-value=fitt-test-secret-key-at-least-32-characters!!
fitt.jwt.issuer=fitt-api
fitt.jwt.ttl-seconds=3600

# A fixed key so the two-step sign-in tests can run. It is the Base64 of the
# text "fitt-test-only-mfa-key-32-bytes!" and protects nothing.
fitt.mfa.encryption-key=Zml0dC10ZXN0LW9ubHktbWZhLWtleS0zMi1ieXRlcyE=

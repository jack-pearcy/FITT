# Integration test profile. MySQL container provides the datasource with @ServiceConnection.
# Hibernate auto-detects MySQL from the connection, so no dialect override here.

spring.jpa.hibernate.ddl-auto=create

# JWT settings copied from application-test.properties so the security context loads.
fitt.jwt.secret-value=fitt-test-secret-key-at-least-32-characters!!
fitt.jwt.issuer=fitt-api
fitt.jwt.ttl-seconds=3600

# Temp for error logging
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=ERROR

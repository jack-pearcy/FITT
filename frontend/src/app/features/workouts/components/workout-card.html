<div class="workout-card">
  <div class="workout-card__info">
    <span class="workout-card__name">{{ workout.name }}</span>
    <span class="workout-card__date">{{ workout.createdAt | date:'mediumDate' }}</span>
  </div>
  <button class="workout-card__delete" (click)="onDelete()">Delete</button>
</div>

# Generates FITT.xcodeproj. Run `xcodegen` in this folder after any change here.
# The generated project and App/Info.plist are ignored by git.
name: FITT
options:
  bundleIdPrefix: dev.fittapp
  deploymentTarget:
    iOS: "17.0"
packages:
  FittKit:
    path: FittKit
targets:
  FITT:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FITT
        UILaunchScreen: {}
        # The app is always dark, so the launch screen is too. Without this it is
        # white on a phone in light mode, and flashes before the first screen.
        UIUserInterfaceStyle: Dark
        # Lets the simulator reach a backend on this Mac over plain http.
        # Remote hosts still require https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: FittKit
        product: FittUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fittapp.fitt
        # The icon is drawn by tools/make-icon.swift into App/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"

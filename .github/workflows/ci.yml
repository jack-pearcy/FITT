# Continuous integration for FITT.
# Runs the backend test suite on pull requests into main and on pushes to
# main, so a PR cannot merge until the tests pass. On a push to main or a
# manual run, the images are built, scanned, and pushed to GitHub Container
# Registry tagged by commit SHA, and only published if the scan is clean.
# Pull requests only run the tests, they do not publish. Deploy to the server
# is a separate workflow behind a manual approval.
name: CI

# Quoted so YAML does not read the bare word on as a boolean.
"on":
  # Runs the tests on every PR into main. This is the check the branch
  # ruleset requires before a merge is allowed.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets us run the pipeline by hand from the Actions tab when needed.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # CI gate. Nothing downstream runs unless these tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Java 21 to match the pom. Temurin is the standard distribution.
      # The setup action caches Maven dependencies between runs so the
      # build does not re-download the world every time.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Make the wrapper executable. Git on Windows does not always
      # preserve the execute bit, so we set it on the runner to be safe.
      - name: Make the Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      # The fast tests: plain unit tests and the H2-backed context tests.
      # No Docker needed, so a failure here shows up quickly before anything
      # heavier starts.
      - name: Run the fast tests
        working-directory: backend
        run: ./mvnw --batch-mode test

      # The integration tests, tagged "integration", run under Failsafe and
      # start a real MySQL through Testcontainers on the runner's Docker.
      # Only reached when the fast tests above pass. The fast step already
      # compiled the test classes, so these goals reuse them.
      - name: Run the integration tests
        working-directory: backend
        run: ./mvnw --batch-mode failsafe:integration-test failsafe:verify

  # Build both images, scan them, and publish only if the scan is clean.
  # Runs after the tests pass, and only on a push to main or a manual run.
  # Pull requests skip this so proposed code never publishes an image.
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    # The default token can read packages but not write them. Grant package
    # write access so the push to ghcr.io succeeds.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # ghcr.io rejects uppercase in the image path, but a GitHub username
      # keeps its case. Lowercase the owner once and build the two full image
      # refs here so every step below uses the same strings.
      - name: Resolve the image names
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "backend=${{ env.REGISTRY }}/${owner}/fitt-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend=${{ env.REGISTRY }}/${owner}/fitt-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Buildx is Docker's extended builder. The build-push action below needs it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to ghcr.io with the token GitHub mints for this run.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the backend image to a local tarball instead of pushing. Scanning
      # the tarball needs no registry and no daemon access, so the image is
      # never published until Trivy has cleared it.
      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          tags: ${{ steps.img.outputs.backend }}
          outputs: type=docker,dest=/tmp/backend-image.tar

      # Fail on any fixable HIGH or CRITICAL vulnerability. ignore-unfixed
      # drops vulnerabilities with no patch yet, since blocking on something
      # that cannot be fixed only jams the pipeline. Pinned to a commit SHA,
      # not a tag: the trivy-action tags were hijacked in a March 2026
      # supply-chain attack (CVE-2026-33634), so a tag is not safe to trust.
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          input: /tmp/backend-image.tar
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      # Scan passed, so load the tarball into Docker and push it.
      - name: Push the backend image
        run: |
          docker load --input /tmp/backend-image.tar
          docker push ${{ steps.img.outputs.backend }}

      # Same build, scan, push sequence for the frontend-plus-Caddy image.
      - name: Build the frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          tags: ${{ steps.img.outputs.frontend }}
          outputs: type=docker,dest=/tmp/frontend-image.tar

      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          input: /tmp/frontend-image.tar
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Push the frontend image
        run: |
          docker load --input /tmp/frontend-image.tar
          docker push ${{ steps.img.outputs.frontend }}
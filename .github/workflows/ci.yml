# Continuous integration for FITT.
# Runs the backend test suite on pull requests into main and on pushes to
# main, so a PR cannot merge until the tests pass. On a push to main or a
# manual run, the images are also built and pushed to GitHub Container
# Registry tagged by commit SHA. Pull requests only run the tests, they do
# not publish. Deploy to the server is a separate workflow behind a manual
# approval.
name: CI

# Quoted so YAML does not read the bare word on as a boolean.
"on":
  # Runs the tests on every PR into main. This is the check the branch
  # ruleset requires before a merge is allowed.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets us run the pipeline by hand from the Actions tab when needed.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # CI gate. Nothing downstream runs unless these tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # Java 21 to match the pom. Temurin is the standard distribution.
      # The setup action caches Maven dependencies between runs so the
      # build does not re-download the world every time.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Make the wrapper executable. Git on Windows does not always
      # preserve the execute bit, so we set it on the runner to be safe.
      - name: Make the Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      # Tests run against H2 in-memory for unit tests, and the one
      # integration test starts its own MySQL via Testcontainers using
      # the Docker daemon preinstalled on the runner.
      - name: Run the backend tests
        working-directory: backend
        run: ./mvnw --batch-mode test

  # Build and publish both images. Runs after the tests pass, and only on a
  # push to main or a manual run. Pull requests skip this so proposed code
  # never publishes an image.
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    # The default token can read packages but not write them. We have to
    # grant package write access for the push to ghcr.io to succeed.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # ghcr.io rejects any uppercase in the image path, but a GitHub
      # username keeps its original case. Lowercase the owner once here
      # and reuse it for both image tags.
      - name: Lowercase the registry owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Buildx is Docker's extended builder. The build-push action below
      # expects it to be set up.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to ghcr.io with the token GitHub mints for this run.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the backend image and push it, tagged with the commit SHA
      # so every build is traceable to a commit.
      - name: Build and push the backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/fitt-backend:${{ github.sha }}

      # Build the frontend-plus-Caddy image and push it the same way.
      - name: Build and push the frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/fitt-frontend:${{ github.sha }}

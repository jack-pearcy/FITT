# Deploys FITT to the production server.
# This is deliberately separate from CI. CI builds and publishes images on
# every push to main. This workflow takes a published image and rolls it onto
# the live box, but only after a human approves the production environment.
# That approval gate is what makes this Continuous Delivery rather than
# Continuous Deployment.
name: Deploy

"on":
  # Run by hand from the Actions tab. The image tag to deploy is chosen at
  # trigger time. Use the commit SHA of the images CI built and pushed.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit SHA) to deploy"
        required: true

# One deploy at a time. A second run waits for the first instead of racing it
# on the server's .env and containers.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # Only from main. The deploy script and the backup script that land on the
    # server come from the branch this run starts on, so another branch must not
    # be able to supply them. The production environment has the same rule.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Links this job to the production environment. The required-reviewers
    # protection rule on that environment is what pauses the job for approval
    # before any of the steps below run.
    environment: production
    # The run-scoped token needs read access to the packages to pull them.
    permissions:
      contents: read
      packages: read
    steps:
      # The tag comes from a free-text input and ends up inside a sed command on the
      # server, so refuse anything that is not a full commit SHA before touching the
      # server. CI tags every image with github.sha, which is exactly 40 hex chars.
      - name: Validate the image tag
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if ! [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi

      # The deploy script comes from the commit this workflow runs from, so going
      # back to an older image still uses the current, tested way of deploying.
      # The whole history of main is fetched so the next step can tell whether
      # the tag is a commit of main.
      - name: Check out the deploy script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The compose file comes from the commit being deployed, so the server never
      # runs a build against a compose file written for a different one.
      #
      # The tag must be a commit of main. GitHub also serves commits that only
      # exist in pull requests, including ones from forks, and a compose file
      # from one of those could mount the host's disk. Nothing is fetched by
      # SHA: a commit that is not in main's history is refused here, before the
      # server is touched.
      #
      # Both files travel to the server as base64 in environment variables. That
      # keeps the SSH step to the one action already trusted with the key, and
      # base64 has no character a shell would read as anything but text.
      - name: Pack the compose file and the deploy script
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if ! git cat-file -e "${IMAGE_TAG}^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "${IMAGE_TAG}" HEAD; then
            echo "image_tag is not a commit on main, refusing to deploy it" >&2
            exit 1
          fi
          git show "${IMAGE_TAG}:docker-compose.prod.yml" > "${RUNNER_TEMP}/docker-compose.prod.yml"
          echo "COMPOSE_FILE_B64=$(base64 -w0 "${RUNNER_TEMP}/docker-compose.prod.yml")" >> "$GITHUB_ENV"
          echo "DEPLOY_SCRIPT_B64=$(base64 -w0 deploy/deploy.sh)" >> "$GITHUB_ENV"
          echo "BACKUP_SCRIPT_B64=$(base64 -w0 deploy/backup-offsite.sh)" >> "$GITHUB_ENV"

      # SSH to the server and hand over to deploy/deploy.sh, which pulls the
      # images, dumps the database, starts the new containers and waits for the
      # backend to report healthy. If it does not, the script exits non-zero and
      # this job fails. The server keeps the production .env; nothing in it is
      # read or printed here.
      #
      # GHCR auth uses the token GitHub mints for this run, passed in over SSH
      # as an env var. The server stores no standing registry credential; the
      # login lasts only as long as the deploy.
      - name: Deploy over SSH
        # Pinned to the v1.2.5 commit, not the @v1 tag, same rule as the other actions.
        # This step holds the production SSH key, so it matters most.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pass the env vars above into the remote shell session.
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_TAG,COMPOSE_FILE_B64,DEPLOY_SCRIPT_B64,BACKUP_SCRIPT_B64
          # The dump and the health wait can take a few minutes between them.
          command_timeout: 15m
          script: |
            set -e
            cd /opt/fitt
            umask 077
            printf '%s' "${COMPOSE_FILE_B64}" | base64 -d > docker-compose.prod.yml.new
            printf '%s' "${DEPLOY_SCRIPT_B64}" | base64 -d > deploy.sh
            # Kept current by every deploy. It only runs from the server's own
            # nightly schedule, never from here.
            printf '%s' "${BACKUP_SCRIPT_B64}" | base64 -d > backup-offsite.sh
            export GHCR_TOKEN GHCR_ACTOR IMAGE_TAG
            bash deploy.sh

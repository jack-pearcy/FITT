# Keeps pinned dependencies current. The workflows pin every action to a commit
# SHA, which is safe against tag hijacking but goes stale without help. Dependabot
# understands SHA pins with a "# vX.Y.Z" comment and opens PRs that move both.
# The base images are deliberately tag-pinned rather than digest-pinned: the
# Dockerfiles run `apk upgrade` and CI gates on Trivy so security patches flow in
# on every build, and a digest pin would freeze that. Dependabot still proposes
# base image bumps weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

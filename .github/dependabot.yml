# Keeps pinned dependencies current. The workflows pin every action to a commit
# SHA, which is safe against tag hijacking but goes stale without help. Dependabot
# understands SHA pins with a "# vX.Y.Z" comment and opens PRs that move both.
# The base images are deliberately tag-pinned rather than digest-pinned: the
# Dockerfiles run `apk upgrade` and CI gates on Trivy so security patches flow in
# on every build, and a digest pin would freeze that. Dependabot still proposes
# base image bumps weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    # Angular's packages are released together and only install at matching
    # versions. One pull request per package left the others behind, and npm
    # refused to install the result, so they move as one group.
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
    # A new major Angular release needs "ng update" and its migrations, not a
    # version bump. vitest and TypeScript follow the ranges the installed
    # Angular supports, so their majors wait for that upgrade too. Security
    # updates are not affected by these rules.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
